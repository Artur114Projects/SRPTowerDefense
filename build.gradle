buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net"
        }
    }
    dependencies {
        classpath("com.anatawa12.forge:ForgeGradle:2.3-1.0.+") {
            changing = true
        }
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'groovy'
apply plugin: 'java'

group = "com.artur114.srptowerdefense"
archivesBaseName = "SRPTowerDefense"
version = mod_version

repositories {
    maven {url 'https://jitpack.io'}
}

configurations {
    include; implementation.extendsFrom(include)
}

dependencies {
    include('com.github.Artur114Projects.BananaLib:asm:1.0.5-betta') {transitive=false}
    include('com.github.Artur114Projects.BananaLib:util:1.0.5-betta') {transitive=false}
    include('com.github.Artur114Projects.BananaLib:math:1.0.5-betta') {transitive=false}
    include('com.github.Artur114Projects.BananaLib:mc:1.0.5-betta') {transitive=false}

    implementation localGroovy()
    implementation 'com.github.Artur114Projects.BananaLib:math-groovy:1.0.5-betta'
    implementation 'org.jetbrains:annotations:24.0.0'
    compile fileTree(dir: "libs", includes: ['*.jar'])
}

minecraft {
    runDir = 'run'
    version = "1.12.2-14.23.5.2847"
    mappings = "snapshot_20171003"
    clientRunArgs += ["--uuid", "11111111-1111-1111-1111-111111111111"]
}

jar {
    from {
        configurations.include.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    manifest {
        attributes([
            "Implementation-Vendor": mod_author,
            "Implementation-Version": mod_version,
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            "Included-Libs": "[${configurations.include.collect{it.name.substring(0, it.name.lastIndexOf('.'))}.join(", ")}]",
            "FMLAT": 'td_at.cfg'
        ])
    }
}